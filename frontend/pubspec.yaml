name: frontend
description: "Airspace — Executive Flight Intelligence"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2
  webview_flutter_linux: ^0.1.0-dev.2
  google_fonts: 8.2.1
  pointer_interceptor: ^0.10.1+3
  webview_flutter_windows: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pictures/
    # For offline asset builds later (after `npm run build`):
    # - assets/flight-map-3d/dist/build/