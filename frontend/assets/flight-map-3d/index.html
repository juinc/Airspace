<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airspace — Executive Flight Intelligence</title>
    <style>
      :root {
        --bg: #070b12;
        --panel: rgba(13, 20, 30, 0.72);
        --panel-solid: #0d141e;
        --hairline: rgba(255, 255, 255, 0.09);
        --hairline-strong: rgba(255, 255, 255, 0.16);
        --text: #e9eef4;
        --muted: #8fa3b5;
        --faint: #5c7086;
        --gold: #e3b563;
        --gold-soft: rgba(227, 181, 99, 0.16);
        --cyan: #6fd3e8;
        --good: #6fd6a0;
        --bad: #e2836f;
        --radius: 12px;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10151c;
        color: var(--text);
        font:
          13px/1.45 'Inter',
          'SF Pro Display',
          system-ui,
          -apple-system,
          sans-serif;
        font-feature-settings: 'tnum' 1, 'ss01' 1;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        opacity: 0;
        transition: opacity 1.1s ease;
      }
      body.scene-ready #app { opacity: 1; }

      /* ---------- Boot overlay ---------- */
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 10%, #0c1524 0%, #05080e 70%);
        transition: opacity 0.7s ease;
      }
      body.scene-ready #boot-overlay {
        opacity: 0;
        pointer-events: none;
      }
      .boot-brand {
        font-size: 30px;
        font-weight: 200;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        color: var(--text);
      }
      .boot-brand b { font-weight: 600; color: var(--gold); }
      .boot-sub {
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .boot-bar {
        width: 180px;
        height: 2px;
        margin-top: 10px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--gold);
        animation: boot-sweep 1.2s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }

      /* ---------- Shared glass panel ---------- */
      .glass {
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(14px) saturate(1.2);
      }

      /* ---------- Top bar ---------- */
      #scene-overlay {
        position: fixed;
        inset: 16px 16px auto;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        pointer-events: none;
      }

      .brand-block {
        display: grid;
        gap: 6px;
        max-width: min(52vw, 640px);
      }
      .brand-line {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .brand-mark b { color: var(--gold); font-weight: 700; }
      .brand-divider {
        width: 1px;
        height: 14px;
        background: var(--hairline-strong);
      }
      .brand-tag {
        font-size: 9.5px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--faint);
      }
      #data-status {
        padding: 8px 12px;
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      #data-status::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 8px var(--good);
        vertical-align: 1px;
      }

      /* ---------- Scenario control ---------- */
      .scenario-control {
        display: grid;
        gap: 7px;
        padding: 11px 13px;
        min-width: 250px;
        pointer-events: auto;
      }
      .scenario-control label {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .scenario-control select {
        padding: 8px 10px;
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        border: 1px solid var(--hairline-strong);
        border-radius: 8px;
        background: var(--panel-solid);
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s ease;
      }
      .scenario-control select:hover,
      .scenario-control select:focus { border-color: var(--gold); }

      /* ---------- Metrics ---------- */
      .metrics {
        position: fixed;
        top: 86px;
        right: 16px;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(2, minmax(158px, 1fr));
        gap: 16px;
        padding: 14px 16px;
        pointer-events: none;
      }
      .metric-group { display: grid; gap: 5px; align-content: start; }
      .metric-title {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--faint);
        padding-bottom: 5px;
        border-bottom: 1px solid var(--hairline);
        margin-bottom: 2px;
      }
      .metric-title.opt { color: var(--gold); }
      .metric-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      .metric-row span { color: var(--muted); font-size: 11.5px; }
      .metric-row strong { font-weight: 600; font-size: 12.5px; }
      .metric-row.delta strong { font-size: 11px; font-weight: 600; }
      .delta-good { color: var(--good); }
      .delta-bad { color: var(--bad); }

      /* ---------- Altitude legend ---------- */
      #altitude-legend {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        min-width: 196px;
        padding: 12px 14px;
      }
      .altitude-legend-title {
        margin-bottom: 8px;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .altitude-level-row {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        align-items: center;
        gap: 9px;
        min-height: 21px;
        font-size: 11.5px;
      }
      .altitude-level-swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
      }
      .altitude-level-row span:last-child { color: var(--muted); }

      /* ---------- Disclaimer ---------- */
      #terrain-note {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        max-width: 300px;
        padding: 7px 11px;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--faint);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: rgba(13, 20, 30, 0.55);
        backdrop-filter: blur(8px);
      }

      @media (max-width: 760px) {
        #scene-overlay { inset: 10px 10px auto; flex-direction: column; }
        .metrics {
          top: auto;
          bottom: 64px;
          right: 10px;
          left: 10px;
          grid-template-columns: 1fr 1fr;
        }
        #terrain-note { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="boot-overlay">
      <div class="boot-brand"><b>AIR</b>SPACE</div>
      <div class="boot-sub">Executive Flight Intelligence</div>
      <div class="boot-bar"><span></span></div>
    </div>

    <div id="scene-overlay">
      <div class="brand-block">
        <div class="brand-line">
          <span class="brand-mark"><b>AIR</b>SPACE</span>
          <span class="brand-divider"></span>
          <span class="brand-tag">Executive Flight Intelligence</span>
        </div>
        <div id="data-status" class="glass" role="status" aria-live="polite">
          Initializing…
        </div>
      </div>

      <div class="scenario-control glass">
        <label for="scenario-selector">Weather Scenario</label>
        <select id="scenario-selector" title="Weather scenario"></select>
      </div>
    </div>

    <section class="metrics glass" aria-label="Route metrics">
      <div class="metric-group">
        <div class="metric-title">Baseline</div>
        <div class="metric-row"><span>Distance</span><strong id="baseline-distance">—</strong></div>
        <div class="metric-row"><span>Time</span><strong id="baseline-time">—</strong></div>
        <div class="metric-row"><span>Exposure</span><strong id="baseline-exposure">—</strong></div>
      </div>
      <div class="metric-group">
        <div class="metric-title opt">Optimized</div>
        <div class="metric-row"><span>Distance</span><strong id="optimized-distance">—</strong></div>
        <div class="metric-row"><span>Time</span><strong id="optimized-time">—</strong></div>
        <div class="metric-row"><span>Exposure</span><strong id="optimized-exposure">—</strong></div>
        <div class="metric-row delta"><span>Advantage</span><strong id="optimized-delta">—</strong></div>
      </div>
    </section>

    <div id="terrain-note" role="note">
      Modeled simulation. Terrain clearance not validated — not for flight use.
    </div>

    <section id="altitude-legend" class="glass" aria-label="Pressure altitude layers">
      <div class="altitude-legend-title">Pressure Layers</div>
      <div id="altitude-level-list"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
