<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Map 3D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #222021;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #scene-overlay {
        position: fixed;
        inset: 14px 14px auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        color: #eef2f5;
        font:
          12px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
      }

      #data-status,
      .metrics,
      .scenario-control,
      #altitude-legend,
      #terrain-note {
        border: 1px solid rgba(220, 232, 240, 0.22);
        border-radius: 6px;
        background: rgba(13, 17, 23, 0.86);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(8px);
      }

      #data-status {
        max-width: min(58vw, 680px);
        padding: 9px 12px;
        overflow-wrap: anywhere;
      }

      .scenario-control {
        display: grid;
        gap: 5px;
        padding: 9px 12px;
        pointer-events: auto;
      }

      .scenario-control label {
        color: #a9bdca;
        font-weight: 700;
      }

      .scenario-control select {
        min-width: 220px;
        padding: 5px 7px;
        color: #eef2f5;
        border: 1px solid rgba(220, 232, 240, 0.3);
        border-radius: 4px;
        background: #18212b;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(128px, 1fr));
        gap: 14px;
        padding: 10px 12px;
      }

      .metric-group {
        display: grid;
        gap: 4px;
      }

      .metric-title {
        color: #a9bdca;
        font-weight: 700;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .metric-row span {
        color: #a9bdca;
      }

      .metric-row strong {
        text-align: right;
      }

      #altitude-legend {
        position: fixed;
        right: 14px;
        bottom: 14px;
        min-width: 180px;
        padding: 9px 11px;
        color: #eef2f5;
        font-size: 11px;
      }

      .altitude-legend-title {
        margin-bottom: 6px;
        color: #a9bdca;
        font-weight: 700;
      }

      .altitude-level-row {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        align-items: center;
        gap: 7px;
        min-height: 19px;
      }

      .altitude-level-swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .altitude-level-row span:last-child {
        color: #a9bdca;
      }

      #terrain-note {
        position: fixed;
        left: 14px;
        bottom: 14px;
        max-width: 320px;
        padding: 8px 11px;
        color: #ffd5a1;
        font-size: 11px;
      }

      @media (max-width: 700px) {
        #scene-overlay {
          inset: 8px 8px auto;
          flex-direction: column;
        }
        #data-status {
          max-width: 100%;
        }
        .metrics {
          width: 100%;
          box-sizing: border-box;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="scene-overlay">
      <div id="data-status" role="status" aria-live="polite">
        Waiting for synthetic weather scenario...
      </div>
      <div class="scenario-control">
        <label for="scenario-selector">Weather scenario</label>
        <select id="scenario-selector">
          <option value="heavy-storms">A lot more storms</option>
          <option value="random-storms">Random storms</option>
          <option value="clear-airspace">Clear airspace</option>
          <option value="layered-random">
            Random weather by altitude layer
          </option>
          <option value="real-meteo">Live Open-Meteo forecast</option>
        </select>
      </div>
      <section class="metrics" aria-label="Route metrics">
        <div class="metric-group">
          <strong class="metric-title">Baseline</strong>
          <div class="metric-row">
            <span>Distance</span><strong id="baseline-distance">N/A</strong>
          </div>
          <div class="metric-row">
            <span>Time</span><strong id="baseline-time">N/A</strong>
          </div>
          <div class="metric-row">
            <span>Exposure</span><strong id="baseline-exposure">N/A</strong>
          </div>
        </div>
        <div class="metric-group">
          <strong class="metric-title">Optimized</strong>
          <div class="metric-row">
            <span>Distance</span><strong id="optimized-distance">N/A</strong>
          </div>
          <div class="metric-row">
            <span>Time</span><strong id="optimized-time">N/A</strong>
          </div>
          <div class="metric-row">
            <span>Exposure</span><strong id="optimized-exposure">N/A</strong>
          </div>
        </div>
      </section>
    </div>
    <div id="terrain-note" role="note">
      Terrain clearance is not validated. Not for flight use.
    </div>
    <section
      id="altitude-legend"
      class="metrics"
      aria-label="Pressure altitude layers"
    >
      <div>
        <div class="altitude-legend-title">Pressure layers</div>
        <div id="altitude-level-list"></div>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
