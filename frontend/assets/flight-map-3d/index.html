<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <title>Airspace 3D Scene</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070b12;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Interactive Airspace 3D scene"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
