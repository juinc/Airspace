<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airspace — 3D Scene</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05080e;
      }

      /* Borderless fullscreen canvas — Flutter draws all UI on top. */
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        opacity: 0;
        transition: opacity 1s ease;
      }
      body.scene-ready #app { opacity: 1; }

      /* Minimal boot splash — replaced by Flutter's own loader after onReady. */
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 10%, #0c1524 0%, #05080e 70%);
        transition: opacity 0.7s ease;
      }
      body.scene-ready #boot-overlay {
        opacity: 0;
        pointer-events: none;
      }
      .boot-brand {
        font-size: 30px;
        font-weight: 200;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        color: #e9eef4;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .boot-brand b { font-weight: 600; color: #e3b563; }
      #boot-status {
        max-width: min(80vw, 360px);
        min-height: 1.5em;
        color: #8fa3b5;
        font: 11px/1.5 'Inter', system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="boot-overlay">
      <div class="boot-brand"><b>AIR</b>SPACE</div>
      <div id="boot-status" role="status" aria-live="polite">Preparing 3D scene…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
